# Used for local development only (`wrangler pages dev`).
# Production bindings are configured in the Cloudflare dashboard under
# Pages project > Settings > Functions (see README Step 5) and are
# independent of this file.
name = "urban-plaza-cafe"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "urban-plaza-cafe"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "urban-plaza-cafe-photos"
